    <!-- PWA & Mobile Meta Tags -->
    <meta name="description" content="Asistente digital profesional para jugar al bingo con cartones físicos reales. Detección automática de patrones, 100% offline y guardado seguro." />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="bg-[#090a0f] text-slate-100 font-sans">
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('BINGO NEXUS SW registrado con éxito:', reg.scope))
            .catch((err) => console.warn('BINGO NEXUS SW fallo de registro:', err));
        });
      }
    </script>
  </body>
