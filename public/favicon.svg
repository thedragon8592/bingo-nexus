<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="60%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#c84b00" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ff6b00" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#glow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#252a3b" stroke-width="8" />

  <!-- Bingo Ball with glow -->
  <circle cx="256" cy="256" r="170" fill="url(#grad1)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="166" fill="none" stroke="#ffd180" stroke-width="4" opacity="0.6" />

  <!-- Ball White Inset Circle -->
  <circle cx="256" cy="256" r="95" fill="#090a0f" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#ffb74d" stroke-width="4" />

  <!-- Text BN -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">
    BN
  </text>
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ff9800" text-anchor="middle" letter-spacing="4">
    NEXUS
  </text>
</svg>